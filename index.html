<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaze Blur</title>
<style>
  :root { --fg:#eee; --dim:#888; --accent:#7CFFB2; --warn:#FF6B6B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; background:#000; color:var(--fg);
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; overflow:hidden; }

  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #img { max-width:100%; max-height:100%; object-fit:contain; display:none;
    will-change: filter, transform; }
  body.fit-cover #img { width:100%; height:100%; max-width:none; max-height:none; object-fit:cover; }

  #drop { position:fixed; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; text-align:center; cursor:pointer; }
  #drop .box { border:1px dashed #555; padding:48px 64px; border-radius:6px; }
  #drop.over .box { border-color:var(--accent); color:var(--accent); }
  #drop small { color:var(--dim); }

  #hud { position:fixed; top:16px; right:16px; width:260px; background:rgba(0,0,0,.72);
    border:1px solid #333; border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:10px;
    backdrop-filter: blur(6px); z-index:10; }
  #hud.hidden { display:none; }
  #cam { width:100%; aspect-ratio:4/3; object-fit:cover; transform:scaleX(-1); border-radius:4px; background:#111; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .row label { color:var(--dim); }
  input[type=range] { width:120px; accent-color: var(--accent); }
  #status { font-weight:bold; }
  #status.on { color:var(--accent); } #status.off { color:var(--warn); }
  .bar { height:4px; background:#222; border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .keys { color:var(--dim); font-size:11px; line-height:1.6; }
  button { background:#1a1a1a; color:var(--fg); border:1px solid #444; border-radius:4px; padding:6px 8px;
    font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  body.fs.hud-off { cursor:none; }
</style>
</head>
<body>
<div id="stage"><img id="img" alt=""></div>

<div id="drop">
  <div class="box">Drop an image here, or click to choose</div>
  <small>Allow camera access for this to work</small>
</div>
<input id="file" type="file" accept="image/*" hidden>

<div id="hud">
  <video id="cam" playsinline muted></video>
  <div class="row"><span>Gaze</span><span id="status" class="off">Loading…</span></div>
  <div class="row"><label>Blur</label><span id="blurVal">0px</span></div>
  <div class="bar"><i id="blurBar"></i></div>

  <div class="row"><label>Max blur</label><input id="maxBlur" type="range" min="5" max="150" value="80"></div>
  <div class="row"><label>Blur time (s)</label><input id="ramp" type="range" min="0.1" max="10" step="0.1" value="0.4"></div>
  <div class="row"><label>Recover time (s)</label><input id="recover" type="range" min="0.05" max="5" step="0.05" value="0.25"></div>
  <div class="row"><label>Sensitivity</label><input id="sens" type="range" min="1" max="10" value="5"></div>
  <div class="row"><label>Curve</label>
    <select id="curve" style="background:#1a1a1a;color:#eee;border:1px solid #444;font:inherit">
      <option value="out">Instant (ease-out)</option><option value="linear">linear</option><option value="ease">ease-in</option>
    </select></div>

  <div class="btns">
    <button id="btnCal">Calibrate (C)</button>
    <button id="btnFs">Fullscreen (F)</button>
    <button id="btnNew">New image (O)</button>
    <button id="btnFit">Fill (V)</button>
  </div>
  <div class="keys">H hide panel · R reset blur · F fullscreen<br>
  C: stand where the viewer will be, look at the center of the screen, and press C to set that as "looking"</div>
</div>

<div id="err" style="display:none;position:fixed;left:16px;bottom:16px;right:16px;max-width:720px;
  background:#2a0d0d;border:1px solid #FF6B6B;color:#ffd6d6;padding:12px 14px;border-radius:6px;
  white-space:pre-wrap;z-index:99;font-size:12px"></div>
<script>
  // classic script: catches errors even if the module below fails to load
  window.showErr = (msg) => {
    const el = document.getElementById("err");
    el.style.display = "block";
    el.textContent += (el.textContent ? "\n\n" : "") + "⚠ " + msg;
    const s = document.getElementById("status"); if (s) s.textContent = "Error (see below)";
  };
  window.addEventListener("error", e => showErr((e.message || "Script error") + (e.filename ? `\n${e.filename}:${e.lineno}` : "")));
  window.addEventListener("unhandledrejection", e => showErr(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  setTimeout(() => { if (!window.__moduleLoaded) showErr("Main script failed to load. Check your internet connection, or open the page directly in Chrome."); }, 8000);
</script>

<script type="module">
window.__moduleLoaded = true;
const $ = id => document.getElementById(id);
let FaceLandmarker, FilesetResolver;
const img = $("img"), drop = $("drop"), file = $("file"), hud = $("hud"), cam = $("cam");

// ---------- image loading ----------
function loadImage(f) {
  if (!f || !f.type.startsWith("image/")) return;
  const url = URL.createObjectURL(f);
  img.onload = () => { img.style.display = "block"; drop.style.display = "none"; };
  img.src = url;
}
drop.onclick = () => file.click();
file.onchange = e => loadImage(e.target.files[0]);
["dragenter","dragover"].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
window.addEventListener("drop", e => loadImage(e.dataTransfer.files[0]));
window.addEventListener("paste", e => {
  const it = [...e.clipboardData.items].find(i => i.type.startsWith("image/"));
  if (it) loadImage(it.getAsFile());
});

// ---------- controls ----------
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
document.addEventListener("fullscreenchange", () => document.body.classList.toggle("fs", !!document.fullscreenElement));
function toggleHud() {
  hud.classList.toggle("hidden");
  document.body.classList.toggle("hud-off", hud.classList.contains("hidden"));
}
let blur = 0;              // 0..1
let baseline = { yaw:0, pitch:0, gx:0, gy:0 };
let calibrateNext = false;

$("btnFs").onclick = toggleFs;
$("btnNew").onclick = () => file.click();
$("btnCal").onclick = () => calibrateNext = true;
$("btnFit").onclick = () => document.body.classList.toggle("fit-cover");
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "f") toggleFs();
  else if (k === "h") toggleHud();
  else if (k === "c") calibrateNext = true;
  else if (k === "r") blur = 0;
  else if (k === "o") file.click();
  else if (k === "v") document.body.classList.toggle("fit-cover");
});

// ---------- camera + face model ----------
const statusEl = $("status");
let landmarker;
async function init() {
  // 1) camera
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr("Camera API is not available here (sandboxed preview or non-https page).\nOpen the page directly in Chrome.");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }, audio: false });
    cam.srcObject = stream;
    await cam.play();
  } catch (err) {
    const why = {
      NotAllowedError: "Camera permission denied. Click the icon left of the address bar → Camera → Allow, then reload. (On Mac also enable Chrome in System Settings → Privacy & Security → Camera.)",
      NotFoundError: "No camera found. Check your webcam connection.",
      NotReadableError: "Another app (Zoom, FaceTime, etc.) is using the camera. Close it and reload.",
      OverconstrainedError: "Camera resolution constraints could not be met."
    }[err.name] || "";
    showErr(`Camera error: ${err.name} — ${err.message}\n${why}`);
    return;
  }
  // 2) model
  statusEl.textContent = "Loading model…";
  let fileset;
  try {
    ({ FaceLandmarker, FilesetResolver } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"));
    fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  } catch (err) {
    showErr(`Failed to load MediaPipe (check internet/firewall): ${err.message || err}`);
    return;
  }
  const opts = delegate => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate
    },
    runningMode: "VIDEO",
    numFaces: 4,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true
  });
  try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch (e1) {
    try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
    catch (e2) { showErr(`Failed to create face model: ${e2.message || e2}`); return; }
  }
  statusEl.textContent = "Ready";
  requestAnimationFrame(loop);
}

// ---------- gaze estimation ----------
const bs = (cats, name) => (cats.find(c => c.categoryName === name) || { score: 0 }).score;

function readFace(i, res) {
  const m = res.facialTransformationMatrixes[i].data;   // column-major 4x4
  const R20 = m[2], R21 = m[6], R22 = m[10];
  const yaw   = Math.asin(Math.max(-1, Math.min(1, -R20))) * 180 / Math.PI;
  const pitch = Math.atan2(R21, R22) * 180 / Math.PI;
  const c = res.faceBlendshapes[i].categories;
  // horizontal eye gaze: + = looking to subject's left
  const gx = ((bs(c,"eyeLookOutLeft") - bs(c,"eyeLookInLeft")) + (bs(c,"eyeLookInRight") - bs(c,"eyeLookOutRight"))) / 2;
  const gy = ((bs(c,"eyeLookUpLeft") + bs(c,"eyeLookUpRight")) - (bs(c,"eyeLookDownLeft") + bs(c,"eyeLookDownRight"))) / 2;
  const blink = (bs(c,"eyeBlinkLeft") + bs(c,"eyeBlinkRight")) / 2;
  return { yaw, pitch, gx, gy, blink };
}

function isLooking(f) {
  const s = +$("sens").value;                 // 1 strict .. 10 loose
  const headTol = 8 + s * 3;                  // degrees
  const eyeTol  = 0.15 + s * 0.05;
  const dy = Math.abs(f.yaw - baseline.yaw), dp = Math.abs(f.pitch - baseline.pitch);
  // head turn and eye turn partly cancel out (looking sideways with head, eyes back to screen)
  const effYaw = Math.abs((f.yaw - baseline.yaw) + (f.gx - baseline.gx) * 30);
  const eyeOff = Math.hypot(f.gx - baseline.gx, f.gy - baseline.gy);
  return f.blink < 0.5 && dp < headTol && (effYaw < headTol) && dy < headTol * 2.2 && eyeOff < eyeTol * 2;
}

// ---------- main loop ----------
let lastT = performance.now(), lastVideoT = -1;
let attention = 0;   // smoothed 0..1

function loop(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  let lookingNow = false, faces = 0;

  if (cam.readyState >= 2 && cam.currentTime !== lastVideoT) {
    lastVideoT = cam.currentTime;
    let res = null;
    loop.ts = Math.max((loop.ts || 0) + 1, Math.round(performance.now()));  // must strictly increase
    try { res = landmarker.detectForVideo(cam, loop.ts); }
    catch (e) { if (!loop.warned) { showErr(`Detection error: ${e.message || e}`); loop.warned = true; } }
    const n = Math.min(res?.faceBlendshapes?.length || 0, res?.facialTransformationMatrixes?.length || 0);
    faces = n;
    const reads = [];
    for (let i = 0; i < n; i++) { try { reads.push(readFace(i, res)); } catch {} }
    if (calibrateNext && reads.length) {
      const f = reads[0];
      baseline = { yaw: f.yaw, pitch: f.pitch, gx: f.gx, gy: f.gy };
      calibrateNext = false;
    }
    lookingNow = reads.some(isLooking);   // any viewer looking counts
    loop.lastLooking = lookingNow; loop.lastFaces = faces;
  } else {
    lookingNow = !!loop.lastLooking; faces = loop.lastFaces || 0;
  }

  // smooth to avoid flicker
  // fast response: jump on when looking, drop quickly when not
  attention += ((lookingNow ? 1 : 0) - attention) * Math.min(1, dt * (lookingNow ? 25 : 30));
  const looking = attention > 0.5;

  const ramp = +$("ramp").value, recover = +$("recover").value;
  blur += looking ? dt / ramp : -dt / recover;
  blur = Math.max(0, Math.min(1, blur));

  const cv = $("curve").value;
  const curved = cv === "ease" ? blur * blur : cv === "out" ? 1 - (1 - blur) * (1 - blur) : blur;
  const px = curved * +$("maxBlur").value;
  img.style.filter = px > 0.05 ? `blur(${px.toFixed(2)}px)` : "none";
  img.style.transform = `scale(${1 + curved * 0.04})`;   // hide soft edges

  statusEl.textContent = faces === 0 ? "No face" : looking ? `Looking (${faces})` : `Not looking (${faces})`;
  statusEl.className = looking ? "on" : "off";
  $("blurVal").textContent = px.toFixed(1) + "px";
  $("blurBar").style.width = (blur * 100) + "%";

  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
